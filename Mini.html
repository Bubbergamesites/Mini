<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google</title>
<link rel="icon" href="https://google.com/favicon.ico" type="image/png">
<style>
  :root { --bg:#111827; --panel:#1f2937; --line:#374151; --text:#f3f4f6; --muted:#9ca3af; --accent:#10b981; --err:#f87171; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }

  #stage { position:fixed; inset:0; }
  iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:#fff; display:none; }
  iframe.on { display:block; }

  /* home / address overlay (the only UI) */
  #home { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:20px; background:var(--bg); z-index:2; }
  #home.hidden { display:none; }
  #home h1 { font-size:3rem; margin:0 0 4px; letter-spacing:.1em; }
  #home p { color:var(--muted); margin:0; }
  #homeForm { display:flex; gap:8px; width:100%; max-width:560px; margin-top:26px; }
  #urlInput { flex:1; min-width:0; height:48px; padding:0 18px; border-radius:24px; border:1px solid var(--line); background:var(--panel); color:var(--text); font-size:16px; }
  #urlInput:focus { outline:2px solid var(--accent); border-color:transparent; }
  #goBtn { height:48px; padding:0 22px; border:0; border-radius:24px; background:var(--accent); color:#062b1f; font-weight:600; font-size:15px; cursor:pointer; }
  #goBtn:disabled { opacity:.5; cursor:default; }
  #statusMsg { margin-top:16px; font-size:13px; color:var(--muted); min-height:18px; word-break:break-all; max-width:560px; }
  #statusMsg.ok { color:var(--accent); } #statusMsg.err { color:var(--err); }
  #hint { margin-top:14px; font-size:12px; color:var(--muted); opacity:.6; }

  /* thin loading line + transient toast while a page is showing */
  #progress { position:fixed; top:0; left:0; right:0; height:2px; z-index:5; pointer-events:none; }
  #progress.on { background:linear-gradient(90deg,transparent,var(--accent),transparent); background-size:50% 100%; background-repeat:no-repeat; animation:slide 1s linear infinite; }
  @keyframes slide { from{background-position:-50% 0} to{background-position:150% 0} }
  #toast { position:fixed; left:10px; bottom:10px; max-width:calc(100% - 20px); padding:6px 12px; border-radius:6px; background:rgba(17,24,39,.92);
    border:1px solid var(--line); color:var(--text); font-size:12px; z-index:5; pointer-events:none; opacity:0; transition:opacity .2s;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #toast.show { opacity:1; } #toast.err { color:var(--err); } #toast.ok { color:var(--accent); }
</style>
<script src="https://cdn.jsdelivr.net/npm/libcurl.js@latest/libcurl_full.js"></script>
</head>
<body>
<div id="progress"></div>
<div id="toast"></div>
<div id="stage">
  <iframe id="view" sandbox="allow-scripts allow-forms allow-popups allow-downloads allow-modals"></iframe>
  <div id="home">
    <h1>Mini</h1>
    <p>the simplest web browser</p>
    <form id="homeForm" autocomplete="off">
      <input id="urlInput" type="text" placeholder="Search or enter address" spellcheck="false" autocapitalize="off" autocorrect="off" inputmode="url" enterkeyhint="go">
      <button id="goBtn" type="submit" disabled>Loading WASM...</button>
    </form>
    <div id="statusMsg">Initializing WebAssembly runtime...</div>
    <div id="hint">Alt+← back · Alt+→ forward · Alt+R reload · Ctrl/Alt+L address · Esc close</div>
  </div>
</div>

<script>
const GATEWAY = 'wss://wisp.mercurywork.shop';
const LIBCURL_BASE = 'https://cdn.jsdelivr.net/npm/libcurl.js@latest/';
const MAX_META_REFRESH = 5;
const $ = id => document.getElementById(id);
const view = $('view'), home = $('home'), urlInput = $('urlInput'), goBtn = $('goBtn');

let ready = false, pending = null;
let history_ = [], idx = -1, token = 0, blobUrl = null, loading = false, toastTimer = null;

/* ================= UI helpers ================= */
function setStatus(msg, kind = '') {
  const s = $('statusMsg'); s.textContent = msg || ''; s.className = kind;
  // toast only matters while a page is on screen
  const t = $('toast');
  clearTimeout(toastTimer);
  if (msg && home.classList.contains('hidden')) {
    t.textContent = msg; t.className = 'show ' + kind;
    if (!loading) toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
  } else t.className = '';
}
function showHome(on) {
  home.classList.toggle('hidden', !on);
  if (on) { urlInput.value = idx >= 0 ? history_[idx].url : ''; urlInput.focus(); urlInput.select(); }
  else $('toast').className = '';
}
function setLoading(on) { loading = on; $('progress').classList.toggle('on', on); }

/* ================= helpers ================= */
function normalizeInput(raw) {
  const input = raw.trim();
  if (!input) return null;
  if (/^(about|data|blob|javascript):/i.test(input)) return null;
  if (/^https?:\/\//i.test(input)) return input;
  if (/^\/\//.test(input)) return 'https:' + input;
  const noSpace = !/\s/.test(input);
  if (noSpace && /^(localhost|\d{1,3}(\.\d{1,3}){3}|[a-z0-9-]+(\.[a-z0-9-]+)+)(:\d+)?([/?#].*)?$/i.test(input)) {
    const scheme = /^(localhost|\d{1,3}(\.\d{1,3}){3})/i.test(input) ? 'http://' : 'https://';
    return scheme + input;
  }
  return 'https://search.brave.com/search?q=' + encodeURIComponent(input);
}
function resolveUrl(href, base) { try { return new URL(href, base).href; } catch { return null; } }
function decodeBody(buf, contentType) {
  let charset = (/charset=([^;\s]+)/i.exec(contentType || '') || [])[1];
  if (!charset) {
    const head = new TextDecoder('latin1').decode(buf.slice(0, 2048));
    charset = (/<meta[^>]+charset=["']?\s*([\w-]+)/i.exec(head) || [])[1];
  }
  try { return new TextDecoder(charset || 'utf-8').decode(buf); }
  catch { return new TextDecoder('utf-8').decode(buf); }
}
function decodeEntities(s) { const t = document.createElement('textarea'); t.innerHTML = s; return t.value; }
function hostOf(u) { try { return new URL(u).host; } catch { return u; } }
function filenameFrom(disp, url) {
  const m = /filename\*?=(?:UTF-8'')?["']?([^"';]+)/i.exec(disp || '');
  if (m) { try { return decodeURIComponent(m[1]); } catch { return m[1]; } }
  try { return decodeURIComponent(new URL(url).pathname.split('/').filter(Boolean).pop() || 'download'); } catch { return 'download'; }
}
function saveBlob(blob, name) {
  const u = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 10000);
}

/* ================= injected into every proxied page ================= */
const INJECT = `<script>(function(){
  var P = function(m, t){ parent.postMessage(Object.assign({mini:1}, m), '*', t || []); };
  var nav = function(url, x){ x = x || {}; P(Object.assign({type:'nav', url:url}, x), x.body instanceof ArrayBuffer ? [x.body] : []); };
  var pend = {}, seq = 0;

  /* ---- links (bubble phase, so the page's own handlers run first and can cancel) ---- */
  function jump(h){
    var id; try { id = decodeURIComponent(h.slice(1)); } catch(_) { id = h.slice(1); }
    var el = id && (document.getElementById(id) || document.getElementsByName(id)[0]);
    if (el) el.scrollIntoView(); else if (!id || id.toLowerCase() === 'top') window.scrollTo(0, 0);
    P({type:'hash', url:document.baseURI.split('#')[0] + h});
  }
  window.addEventListener('click', function(e){
    if (e.defaultPrevented || e.button) return;
    var a = e.target.closest && e.target.closest('a[href], area[href]');
    if (!a) return;
    var raw = (a.getAttribute('href') || '').trim();
    if (!raw || /^(javascript:|mailto:|tel:|sms:|data:|blob:)/i.test(raw)) return;
    e.preventDefault();
    if (raw.charAt(0) === '#') return jump(raw);
    if (a.hasAttribute('download')) return P({type:'download', url:a.href, name:a.getAttribute('download')});
    nav(a.href);
  }, false);
  window.addEventListener('auxclick', function(e){
    var a = e.target.closest && e.target.closest('a[href]');
    if (e.button !== 1 || !a) return;
    e.preventDefault();
    var raw = (a.getAttribute('href') || '').trim();
    if (raw && !/^(#|javascript:|mailto:|tel:|sms:|data:|blob:)/i.test(raw)) nav(a.href);
  }, false);

  /* ---- forms: urlencoded, multipart (file uploads), text/plain, formaction/formmethod/formenctype ---- */
  function sendForm(f, sub){
    var action = (sub && sub.getAttribute('formaction')) || f.getAttribute('action');
    var url = action ? new URL(action, document.baseURI).href : document.baseURI.split('#')[0];
    var method = ((sub && sub.getAttribute('formmethod')) || f.getAttribute('method') || 'get').toLowerCase();
    if (method === 'dialog') return;
    var enc = ((sub && sub.getAttribute('formenctype')) || f.getAttribute('enctype') || 'application/x-www-form-urlencoded').toLowerCase();
    var fd = new FormData(f);
    if (sub && sub.name) fd.append(sub.name, sub.value);
    var str = function(v){ return typeof v === 'string' ? v : (v.name || ''); };
    if (method !== 'post') {
      var u = new URL(url); u.search = ''; u.hash = '';
      fd.forEach(function(v, k){ u.searchParams.append(k, str(v)); });
      return nav(u.href);
    }
    if (enc === 'multipart/form-data') {
      var r = new Response(fd);
      r.arrayBuffer().then(function(buf){ nav(url, {method:'POST', body:buf, contentType:r.headers.get('content-type')}); });
    } else if (enc === 'text/plain') {
      var t = ''; fd.forEach(function(v, k){ t += k + '=' + str(v) + String.fromCharCode(13, 10); });
      nav(url, {method:'POST', body:t, contentType:'text/plain'});
    } else {
      var usp = new URLSearchParams(); fd.forEach(function(v, k){ usp.append(k, str(v)); });
      nav(url, {method:'POST', body:usp.toString(), contentType:'application/x-www-form-urlencoded'});
    }
  }
  window.addEventListener('submit', function(e){
    if (e.defaultPrevented) return;
    e.preventDefault();
    sendForm(e.target, e.submitter);
  }, false);
  // form.submit() fires no submit event, so route it here too
  HTMLFormElement.prototype.submit = function(){ sendForm(this, null); };

  /* ---- no tabs: popups load in the same view ---- */
  window.open = function(u){ if (u) nav(new URL(u, document.baseURI).href); return null; };
  window.addEventListener('hashchange', function(){ P({type:'hash', url:document.baseURI.split('#')[0] + location.hash}); });

  // pushState/replaceState throw in a sandboxed srcdoc frame; swallow so SPAs keep running
  ['pushState', 'replaceState'].forEach(function(n){
    var o = history[n];
    history[n] = function(){ try { return o.apply(this, arguments); } catch(_) {} };
  });

  /* ---- fetch / XMLHttpRequest go through the parent (libcurl), so CORS doesn't block them ---- */
  function rpc(msg, transfer){
    return new Promise(function(res, rej){ var id = ++seq; pend[id] = {res:res, rej:rej}; P(Object.assign({type:'fetch', id:id}, msg), transfer); });
  }
  window.addEventListener('message', function(e){
    var d = e.data;
    if (e.source !== parent || !d || !d.miniRes) return;
    var p = pend[d.id]; if (!p) return;
    delete pend[d.id];
    if (d.error) p.rej(new TypeError(d.error)); else p.res(d);
  });
  window.fetch = function(input, init){
    var req;
    try { req = new Request(input, init); } catch(err) { return Promise.reject(err); }
    return req.arrayBuffer().then(function(buf){
      var h = []; req.headers.forEach(function(v, k){ h.push([k, v]); });
      var has = buf.byteLength > 0;
      return rpc({url:req.url, method:req.method, headers:h, body:has ? buf : null}, has ? [buf] : []);
    }).then(function(d){
      var empty = d.status === 204 || d.status === 205 || d.status === 304;
      var r = new Response(empty ? null : d.body, {status:d.status, statusText:d.statusText, headers:d.headers});
      try { Object.defineProperty(r, 'url', {value:d.url}); } catch(_) {}
      return r;
    });
  };

  function XHR(){ this.readyState = 0; this.status = 0; this.statusText = ''; this.responseText = ''; this.response = null; this.responseType = ''; this.responseURL = ''; this.withCredentials = false; this.timeout = 0; this.upload = {addEventListener:function(){}}; this._h = []; this._l = {}; }
  XHR.UNSENT = 0; XHR.OPENED = 1; XHR.HEADERS_RECEIVED = 2; XHR.LOADING = 3; XHR.DONE = 4;
  var X = XHR.prototype;
  X._e = function(t){
    var ev = {type:t, target:this, currentTarget:this};
    if (typeof this['on' + t] === 'function') { try { this['on' + t](ev); } catch(x) { console.error(x); } }
    (this._l[t] || []).slice().forEach(function(f){ try { f.call(this, ev); } catch(x) { console.error(x); } }, this);
  };
  X._rs = function(n){ this.readyState = n; this._e('readystatechange'); };
  X.open = function(m, u){ this._m = String(m).toUpperCase(); this._u = new URL(u, document.baseURI).href; this._rs(1); };
  X.setRequestHeader = function(k, v){ this._h.push([k, v]); };
  X.overrideMimeType = function(){};
  X.addEventListener = function(t, f){ (this._l[t] = this._l[t] || []).push(f); };
  X.removeEventListener = function(t, f){ var a = this._l[t] || [], i = a.indexOf(f); if (i > -1) a.splice(i, 1); };
  X.abort = function(){ this._x = 1; this._e('abort'); };
  X.getResponseHeader = function(k){
    var v = (this._rh || []).filter(function(h){ return h[0].toLowerCase() === String(k).toLowerCase(); }).map(function(h){ return h[1]; });
    return v.length ? v.join(', ') : null;
  };
  X.getAllResponseHeaders = function(){ return (this._rh || []).map(function(h){ return h[0] + ': ' + h[1] + String.fromCharCode(13, 10); }).join(''); };
  X.send = function(body){
    var x = this, rr = body == null ? null : new Response(body);
    (rr ? rr.arrayBuffer() : Promise.resolve(null)).then(function(buf){
      var h = x._h.slice(), ct = rr && rr.headers.get('content-type'), has = buf && buf.byteLength > 0;
      if (ct && !h.some(function(p){ return p[0].toLowerCase() === 'content-type'; })) h.push(['Content-Type', ct]);
      return rpc({url:x._u, method:x._m, headers:h, body:has ? buf : null}, has ? [buf] : []);
    }).then(function(d){
      if (x._x) return;
      x._rh = d.headers; x.status = d.status; x.statusText = d.statusText; x.responseURL = d.url;
      x._rs(2); x._rs(3);
      var t = x.responseType;
      if (t === 'arraybuffer') x.response = d.body;
      else if (t === 'blob') x.response = new Blob([d.body]);
      else {
        var txt = new TextDecoder().decode(d.body);
        x.responseText = txt;
        x.response = t === 'json' ? (function(){ try { return JSON.parse(txt); } catch(_) { return null; } })()
                   : t === 'document' ? new DOMParser().parseFromString(txt, 'text/html') : txt;
      }
      x._rs(4); x._e('load'); x._e('loadend');
    }).catch(function(){ if (x._x) return; x._rs(4); x._e('error'); x._e('loadend'); });
  };
  window.XMLHttpRequest = XHR;

  /* ---- keyboard shortcuts keep working while the page has focus ---- */
  document.addEventListener('keydown', function(e){
    if (e.getModifierState && e.getModifierState('AltGraph')) return;   // AltGr is how some layouts type @ \\ { }
    var t = e.target, ed = t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName));
    if (ed && e.key.indexOf('Arrow') === 0) return;                      // let Alt+Arrow word-jump work in fields
    if ((e.altKey || e.ctrlKey || e.metaKey) || e.key === 'Escape') {
      if (e.altKey || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'l')) e.preventDefault();
      P({type:'key', key:e.key, alt:e.altKey, ctrl:e.ctrlKey, meta:e.metaKey});
    }
  }, true);
})();<\/script>`;

/* ================= core loader ================= */
async function navigate(target, opts = {}) {
  const { method = 'GET', body, contentType, push = true, metaDepth = 0 } = opts;
  if (!ready) { pending = { target, opts }; setStatus('Waiting for runtime…'); return; }
  const my = ++token;
  setLoading(true);
  setStatus('Loading ' + target + '…');

  try {
    const headers = { 'User-Agent': navigator.userAgent };
    if (body != null) headers['Content-Type'] = contentType || 'application/x-www-form-urlencoded';
    const init = { method, headers, redirect: 'follow' };
    if (body != null && method !== 'GET') init.body = body instanceof ArrayBuffer ? new Uint8Array(body) : body;
    if (body != null && idx >= 0) {
      headers['Referer'] = history_[idx].url;
      try { headers['Origin'] = new URL(history_[idx].url).origin; } catch {}
    }

    const res = await libcurl.fetch(target, init);
    if (my !== token) return;

    const finalUrl = res.url || target;
    const ctype = (res.headers.get('content-type') || '').toLowerCase();
    const disp = res.headers.get('content-disposition') || '';

    const refreshHdr = res.headers.get('refresh');
    if (refreshHdr && metaDepth < MAX_META_REFRESH) {
      const m = /url=\s*['"]?([^'";]+)/i.exec(refreshHdr);
      if (m) { const u = resolveUrl(m[1], finalUrl); if (u) return navigate(u, { push, metaDepth: metaDepth + 1 }); }
    }

    const buf = await res.arrayBuffer();
    if (my !== token) return;

    const finishDownload = () => {
      const name = filenameFrom(disp, finalUrl);
      saveBlob(new Blob([buf], { type: ctype }), name);
      setLoading(false);
      setStatus('Downloaded ' + name, 'ok');
    };
    if (/attachment/i.test(disp)) return finishDownload();

    let page;
    const isHtml = !ctype || /text\/html|application\/xhtml/.test(ctype);
    if (isHtml) {
      let html = decodeBody(buf, ctype);

      const mr = /<meta[^>]+http-equiv=["']?refresh["']?[^>]*content=["']?\s*\d*\s*;?\s*url=\s*['"]?([^'">\s]+)/i.exec(html);
      if (mr && metaDepth < MAX_META_REFRESH) {
        const u = resolveUrl(decodeEntities(mr[1]), finalUrl);
        if (u && u !== finalUrl) return navigate(u, { push, metaDepth: metaDepth + 1 });
      }

      const pb = /<base[^>]+href=["']([^"']+)["']/i.exec(html);
      const baseHref = pb ? (resolveUrl(pb[1], finalUrl) || finalUrl) : finalUrl;

      html = html.replace(/<meta[^>]+http-equiv=["']?(content-security-policy|x-frame-options|refresh)["']?[^>]*>/gi, '')
                 .replace(/<base\b[^>]*>/gi, '')
                 .replace(/\sintegrity=("[^"]*"|'[^']*')/gi, '')
                 .replace(/\scrossorigin(=("[^"]*"|'[^']*'|[^\s>]+))?/gi, '');

      const inject = `<base href="${baseHref.replace(/"/g, '&quot;')}">` + INJECT;
      if (/<head[^>]*>/i.test(html)) html = html.replace(/<head[^>]*>/i, m => m + inject);
      else if (/<html[^>]*>/i.test(html)) html = html.replace(/<html[^>]*>/i, m => m + '<head>' + inject + '</head>');
      else html = '<!DOCTYPE html><head>' + inject + '</head>' + html;
      page = { html };
    } else if (/^(image|video|audio)\/|application\/pdf|^text\/|json|xml/.test(ctype)) {
      page = { blob: new Blob([buf], { type: ctype }) };
    } else {
      return finishDownload();
    }

    const entry = (finalUrl !== target && method !== 'GET')
      ? { url: finalUrl, method: 'GET' }
      : { url: finalUrl, method, body, contentType };
    if (push || idx < 0) { history_ = history_.slice(0, idx + 1); history_.push(entry); idx = history_.length - 1; }
    else history_[idx] = entry;

    showPage(page);
    showHome(false);
    setStatus(finalUrl !== target ? 'Redirected to ' + finalUrl : (res.ok ? '' : `HTTP ${res.status}`), res.ok ? '' : 'err');
  } catch (err) {
    if (my !== token) return;
    console.error(err);
    showError(target, err);
  } finally {
    if (my === token) setLoading(false);
  }
}

function showPage(page) {
  if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = null; }
  if (page.html != null) { view.removeAttribute('src'); view.srcdoc = page.html; }
  else { blobUrl = URL.createObjectURL(page.blob); view.removeAttribute('srcdoc'); view.src = blobUrl; }
  view.classList.add('on');
}

function showError(target, err) {
  const msg = String(err && err.message || err);
  const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  showPage({ html: `<!DOCTYPE html><meta charset="utf-8"><body style="font-family:system-ui;background:#111827;color:#f3f4f6;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center">
    <div style="max-width:480px;padding:20px"><h2 style="margin:0 0 8px">Can't reach this page</h2>
    <p style="color:#9ca3af;word-break:break-all">${esc(target)}</p><p style="color:#f87171">${esc(msg)}</p>
    <p style="color:#9ca3af;font-size:14px">Check the address, or press Alt+R to try again.</p></div></body>` });
  if (idx < 0 || history_[idx].url !== target) {
    history_ = history_.slice(0, idx + 1); history_.push({ url: target, method: 'GET' });
    idx = history_.length - 1;
  }
  showHome(false);
  setStatus('Failed to load: ' + msg, 'err');
}

async function downloadUrl(url, name) {
  try {
    setStatus('Downloading…');
    const res = await libcurl.fetch(url, { headers: { 'User-Agent': navigator.userAgent } });
    saveBlob(new Blob([await res.arrayBuffer()], { type: res.headers.get('content-type') || '' }),
             name || filenameFrom(res.headers.get('content-disposition'), res.url || url));
    setStatus('Download complete', 'ok');
  } catch (e) { setStatus('Download failed: ' + e.message, 'err'); }
}

async function proxyFetch(d, src) {
  const reply = m => { try { src.postMessage(Object.assign({ miniRes: 1, id: d.id }, m), '*', m.body ? [m.body] : []); } catch {} };
  try {
    if (!ready) throw new Error('runtime not ready');
    if (!/^https?:/i.test(d.url)) throw new Error('unsupported URL');
    const headers = { 'User-Agent': navigator.userAgent };
    (d.headers || []).forEach(([k, v]) => { headers[k] = v; });
    const cur = idx >= 0 ? history_[idx].url : '';
    const hasBody = d.body && d.method !== 'GET' && d.method !== 'HEAD';
    if (cur && d.method !== 'GET' && d.method !== 'HEAD') {
      headers['Referer'] = headers['Referer'] || cur;
      try { headers['Origin'] = headers['Origin'] || new URL(cur).origin; } catch {}
    }
    const init = { method: d.method, headers, redirect: 'follow' };
    if (hasBody) init.body = new Uint8Array(d.body);
    const res = await libcurl.fetch(d.url, init);
    const body = await res.arrayBuffer();
    const hs = []; res.headers.forEach((v, k) => hs.push([k, v]));
    reply({ status: res.status, statusText: res.statusText || '', headers: hs, url: res.url || d.url, body });
  } catch (err) { reply({ error: String((err && err.message) || err) }); }
}

/* ================= history / keyboard (no toolbar) ================= */
function goBack()    { if (idx > 0) { idx--; const h = history_[idx]; navigate(h.url, { ...h, push: false }); } }
function goForward() { if (idx < history_.length - 1) { idx++; const h = history_[idx]; navigate(h.url, { ...h, push: false }); } }
function reload()    { if (idx >= 0) { const h = history_[idx]; navigate(h.url, { ...h, push: false }); } }

function handleKey(k) {
  const key = (k.key || '').toLowerCase(), mod = k.ctrl || k.meta;
  if (k.alt && k.key === 'ArrowLeft') goBack();
  else if (k.alt && k.key === 'ArrowRight') goForward();
  else if (k.alt && key === 'r') reload();
  else if ((mod || k.alt) && key === 'l') showHome(true);
  else if (k.alt && key === 'home') { showHome(true); }
  else if (k.key === 'Escape' && idx >= 0 && !home.classList.contains('hidden')) showHome(false);
}
document.addEventListener('keydown', e => {
  if (e.getModifierState && e.getModifierState('AltGraph')) return;
  if (e.key.startsWith('Arrow') && e.target.closest && e.target.closest('input,textarea,[contenteditable]')) return;
  const k = { key: e.key, alt: e.altKey, ctrl: e.ctrlKey, meta: e.metaKey };
  if (e.altKey || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'l')) e.preventDefault();
  handleKey(k);
});

/* ================= messages from proxied pages ================= */
window.addEventListener('message', e => {
  const d = e.data;
  if (!d || !d.mini || e.source !== view.contentWindow) return;
  if (d.type === 'nav' && /^https?:/i.test(d.url)) {
    navigate(d.url, { method: d.method || 'GET', body: d.body, contentType: d.contentType });
  } else if (d.type === 'fetch') {
    proxyFetch(d, e.source);
  } else if (d.type === 'download') {
    downloadUrl(d.url, d.name);
  } else if (d.type === 'hash') {
    if (idx >= 0) history_[idx] = { ...history_[idx], url: d.url };
  } else if (d.type === 'key') {
    handleKey(d);
  }
});

/* ================= wiring ================= */
$('homeForm').addEventListener('submit', e => {
  e.preventDefault();
  const t = normalizeInput(urlInput.value);
  if (t) navigate(t);
});

function initialTarget() {
  const q = new URLSearchParams(location.search).get('url') || decodeURIComponent(location.hash.slice(1));
  return q ? normalizeInput(q) : null;
}

// libcurl.ready is a boolean (not a promise), and the WASM must be loaded explicitly
function loadLibcurl() {
  return new Promise((resolve, reject) => {
    if (libcurl.ready) return resolve();
    const timer = setTimeout(() => reject(new Error('timed out loading libcurl.wasm')), 30000);
    libcurl.onload = () => { clearTimeout(timer); resolve(); };
    try {
      const r = libcurl.load_wasm(LIBCURL_BASE + 'libcurl.wasm');
      if (r && typeof r.catch === 'function') r.catch(e => { clearTimeout(timer); reject(e); });
    } catch (e) { clearTimeout(timer); reject(e); }
  });
}

window.addEventListener('load', async () => {
  urlInput.focus();
  try {
    await loadLibcurl();
    libcurl.set_websocket(GATEWAY);
    ready = true;
    goBtn.disabled = false; goBtn.textContent = 'Go';
    setStatus('Ready!', 'ok');
    const init = initialTarget();
    if (pending) { const p = pending; pending = null; navigate(p.target, p.opts); }
    else if (init) navigate(init);
  } catch (e) {
    console.error(e);
    goBtn.textContent = 'Failed';
    setStatus('WASM init failed: ' + e.message, 'err');
  }
});
</script>
</body>
